name: sync

# 每 6 小时检查 skJack/-lip- 是否有更新；有就重新生成 data.js 与 decks/
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild from source repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build.py

      - name: Commit if changed
        run: |
          git config user.name "lip-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: sync from skJack/-lip-"
            git push
          fi
